spring.application.name=oficinas-ellp

# Banco de dados (sobrescreva via variáveis de ambiente em produção)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/oficinas_ellp}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway (migrações automáticas)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT (troque o secret em produção via variável de ambiente JWT_SECRET)
jwt.secret=${JWT_SECRET:ZWxscC1vZmljaW5hcy1qd3Qtc2VjcmV0LWtleS1wYXJhLWRlc2Vudm9sdmltZW50by0yMDI2}
jwt.expiration=86400000
